plugins {
    id 'com.android.application' version '8.12.3'
}
android {
    namespace 'com.kkomaweb.sudokumate'
    compileSdk 36
    defaultConfig {
        applicationId 'com.kkomaweb.sudokumate'
        minSdk 26
        targetSdk 35
        versionCode 4
        versionName '1.0.0'
    }
    buildFeatures { buildConfig true }
    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = ['src']
            res.srcDirs = ['res']
            assets.srcDirs = [layout.buildDirectory.dir('generated/mateAssets').get().asFile]
        }
    }
}

def webAssets = tasks.register('prepareGameAssets', Exec) {
    inputs.files(fileTree('../assets'), fileTree('vendor'), '../index.html', '../manifest.webmanifest', 'prepare_assets.py')
    def out = layout.buildDirectory.dir('generated/mateAssets').get().asFile
    outputs.dir(out)
    commandLine 'python3', 'prepare_assets.py', out
}
tasks.named('preBuild') { dependsOn webAssets }
dependencies {
    implementation 'com.google.android.gms:play-services-ads:25.5.0'
    implementation 'com.google.android.ump:user-messaging-platform:4.0.0'
}

name: Android APK
on:
  push:
    branches: [sudoku-mate-web]
    paths: ['android/**', 'assets/**', 'index.html', '.github/workflows/android-apk.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - run: gradle -p android assembleRelease --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: sudoku-mate-unsigned
          path: android/build/outputs/apk/release/*-unsigned.apk
          if-no-files-found: error

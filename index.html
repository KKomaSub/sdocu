 case 'pvpRoomCode':pvp.joinCode=e.target.value.replace(/\D/g,'').slice(0,4);if(e.target.value!==pvp.joinCode)e.target.value=pvp.joinCode;break;
 case 'pvpLevel':if(!PVP_LEVELS[e.target.value])return;pvp.level=e.target.value;pvp.turnSeconds=PVP_LEVELS[pvp.level].turn/1000;pvp.matchMinutes=PVP_LEVELS[pvp.level].match/60000; if($('#pvpTurnSeconds'))$('#pvpTurnSeconds').value=pvp.turnSeconds;if($('#pvpMatchMinutes'))$('#pvpMatchMinutes').value=pvp.matchMinutes;break;
 case 'pvpTurnSeconds':pvp.turnSeconds=+e.target.value;break;
 case 'pvpMatchMinutes':pvp.matchMinutes=+e.target.value;break;
 case 'pvpHearts':pvp.hearts=+e.target.value;break;
}}
function pvpKeyDown(event){if(state.view!=='pvp'||event.target.closest('input,textarea,select,[contenteditable]')||!pvp.match?.id)return;
 if(event.key==='/'||event.code==='NumpadDivide'){event.preventDefault();if(!pvp.match.finished){pvp.noteMode=!pvp.noteMode;pvpRender()}return}
 if(/^[1-9]$/.test(event.key)){event.preventDefault();pvpSubmitDigit(+event.key);return}
 if(event.key==='Backspace'||event.key==='Delete'||event.key==='0'){event.preventDefault();pvpClearSelected();return}
 if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(event.key)){event.preventDefault();let i=pvp.selected,r=Math.floor(i/9),c=i%9;if(event.key==='ArrowUp')r=(r+8)%9;else if(event.key==='ArrowDown')r=(r+1)%9;else if(event.key==='ArrowLeft')c=(c+8)%9;else c=(c+1)%9;pvp.selected=r*9+c;pvpRender()}
}
setInterval(()=>{if(pvp.role==='host')pvpHostTick();if(state.view==='pvp')pvpClocks()},125);

render();
pvpInviteFromURL();
window.addEventListener('pagehide',()=>{if(pvp.match&&!pvp.match.finished)pvpSend({type:'forfeit',id:pvp.match.id,who:pvpLocalIdx()})});
if(state.playMode==='time'&&runOf(state.activeId)?.status==='lost')setTimeout(showGameOver,150);
setInterval(updateStopwatch,100);
</script><script src="/assets/matchmaking.js"></script></body></html>
